name: OIDC Claims Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect OIDC Claims
        shell: bash
        run: |
          python - <<'PY'
          import os
          import base64
          import json
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token_request = urllib.request.Request(
              url + "&audience=sts.amazonaws.com",
              headers={
                  "Authorization":
                  "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              }
          )

          response = urllib.request.urlopen(token_request)
          data = json.load(response)

          token = data["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("AUDIENCE:")
          print(claims.get("aud"))

          print("SUBJECT:")
          print(claims.get("sub"))
          PY
          