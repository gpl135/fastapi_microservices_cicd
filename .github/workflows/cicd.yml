```yaml
name: AWS OIDC Authentication Diagnostic

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-auth:
    runs-on: ubuntu-latest

    steps:

      - name: Get GitHub OIDC Token
        id: oidc
        shell: bash
        run: |
          echo "Requesting GitHub OIDC token..."

          TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")

          echo "OIDC token received."

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          # Add padding for base64 decoding
          PADDING=$((4 - ${#PAYLOAD} % 4))
          if [ "$PADDING" -ne 4 ]; then
            PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PADDING))"
          fi

          echo "$PAYLOAD" | base64 -d 2>/dev/null | python -m json.tool

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity
```
