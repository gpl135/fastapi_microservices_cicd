name: FastAPI Microservices CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  test:
    name: Test ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
          - payment-service
          - inventory-service

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Tests
        working-directory: ${{ matrix.service }}
        env:
          PYTHONPATH: .
        run: |
          pytest tests


  docker-build:
    name: Build ${{ matrix.service }}

    needs: test

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - order-service
          - payment-service
          - inventory-service

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ matrix.service }}:${{ github.sha }} \
            ./${{ matrix.service }}

      - name: Show Docker Images
        run: |
          docker images

